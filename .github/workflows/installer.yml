name: Build MynaAuth installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Himeyama/hsis
          ref: e8c86d38bd78f314c0ef52bc436669ceb6598b51 # v0.8.3
          path: hsis
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Check version
        id: version
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and application version must match.' }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Run synthetic checks
        run: |
          foreach ($project in @('MynaAuth.Checks', 'MynaAuth.Jpki.Checks', 'MynaAuth.Windows.Checks', 'MynaAuth.Setup.Checks')) {
            dotnet run --project "tests/$project" -c Release
            if ($LASTEXITCODE -ne 0) { throw "$project failed" }
          }
      - name: Build HSIS CLI
        run: |
          $toolPath = Join-Path $env:RUNNER_TEMP 'hsis-v0.8.3'
          dotnet publish ../hsis/src/Hsis.Cli/Hsis.Cli.csproj -c Release -r win-x64 --self-contained true -o $toolPath
          if ($LASTEXITCODE -ne 0) { throw 'HSIS publish failed' }
          "HSIS_PATH=$toolPath/hsis.exe" >> $env:GITHUB_ENV
      - name: Build installer
        run: |
          $env:HSIS_7ZIP_PATH = 'C:\Program Files\7-Zip\7z.exe'
          ./scripts/Build-Installer.ps1 -HsisPath $env:HSIS_PATH
          ./artifacts/provider-build/Release/ProviderChecks.exe ./artifacts/provider-build/Release/MynaAuthCredentialProvider.dll
          if ($LASTEXITCODE -ne 0) { throw 'Native checks failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: MynaAuth-${{ env.APP_VERSION }}-win-x64
          path: app/artifacts/installer-*/
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MynaAuth-${{ needs.build.outputs.version }}-win-x64
          path: release-input
      - name: Publish release files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem release-input -Recurse -Filter '*-Setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer' }
          $installer = $installers[0]
          $checksum = $installer.FullName + '.sha256'
          $expected = (Get-Content -LiteralPath $checksum).Split(' ')[0]
          $actual = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'Installer checksum mismatch' }
          $zip = Join-Path $PWD "MynaAuth-$env:APP_VERSION-win-x64.zip"
          Compress-Archive -Path (Join-Path $installer.DirectoryName '*') -DestinationPath $zip
          $notes = @'
          Windows 11 x64 向けの開発版です。HSIS v0.8.3 で生成し、.NET ランタイムを同梱しています。

          配布用 ZIP を展開してセットアップを実行してください。EXE とその SHA-256 も添付しています。
          導入・解除の手順: https://github.com/Himeyama/MynaAuth/blob/main/docs/distribution.md
          '@
          $notes | Set-Content release-notes.md -Encoding utf8
          $assets = @($zip, $installer.FullName, $checksum)
          gh release view $env:RELEASE_TAG --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
            gh release create $env:RELEASE_TAG @assets --verify-tag --title "MynaAuth $env:RELEASE_TAG" --notes-file release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
